<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171927"><meta name="description" content="Create a simple four-photo collage."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="1024x1024" href="./icons/icon-1024.png"><link rel="stylesheet" href="./styles.css"><title>AVNEditor</title></head><body><main class="app-shell"><header class="topbar"><div class="brand-mark">AVN</div><div><h1>AVNEditor</h1><p>Four photos. One collage.</p></div><button id="install-button" class="icon-button hidden" type="button">Install</button></header><section class="intro"><span class="eyebrow">Simple photo collage</span><h2>Make a moment worth keeping.</h2><p>Choose up to four photos, arrange them your way, and save your collage.</p></section><section class="workspace"><div class="collage-card"><div id="collage" class="collage" aria-label="Your four photo collage"></div></div><div class="controls"><input id="photo-input" type="file" accept="image/*" multiple hidden><button id="add-button" class="primary-button" type="button">Add photos</button><button id="save-button" class="secondary-button" type="button" disabled>Save collage</button><p id="status" class="status" aria-live="polite">Add up to 4 photos to begin.</p></div></section><section class="how-it-works"><div><span>1</span><p>Add up to four photos</p></div><div><span>2</span><p>Tap a tile to replace it</p></div><div><span>3</span><p>Save your collage</p></div></section></main><script src="./app.js"></script></body></html>
